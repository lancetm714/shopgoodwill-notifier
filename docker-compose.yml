services:
  shopgoodwill-notifier:
    build: .
    image: shopgoodwill-notifier:latest
    container_name: shopgoodwill-notifier
    restart: unless-stopped
    ports:
      - "7823:7823"
    environment:
      - TZ=America/New_York
      - PORT=7823
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
