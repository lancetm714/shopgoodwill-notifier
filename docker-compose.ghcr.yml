# Portainer / GHCR stack.
# Paste this into Portainer -> Stacks -> Add stack.
#
# 1. Replace OWNER/REPO with your GitHub owner and repo (lowercase).
# 2. Change /volume1/docker/shopgoodwill-notifier to a real path on your NAS.
# 3. Before deploying, create that folder, a file `config.json` inside it
#    (content `{}` is fine to start), and an empty `data` subfolder.
#    Docker auto-creates directories but NOT files, so config.json must exist.
services:
  shopgoodwill-notifier:
    image: ghcr.io/OWNER/REPO:latest
    container_name: shopgoodwill-notifier
    restart: unless-stopped
    ports:
      - "7823:7823"
    environment:
      - TZ=America/New_York
      - PORT=7823
    volumes:
      - /volume1/docker/shopgoodwill-notifier/config.json:/app/config.json
      - /volume1/docker/shopgoodwill-notifier/data:/app/data
